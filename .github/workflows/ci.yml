name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Production build: must work with no sample content.
      - run: pnpm build
      - run: pnpm check:dist
      # Preview build with sample content: every template is exercised.
      - run: pnpm build:preview
      - run: pnpm check:dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm lighthouse
