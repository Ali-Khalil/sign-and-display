# Only install package versions that have been public for at least a day.
# This matches the default safety policy of newer pnpm versions, so the
# lockfile installs cleanly everywhere.
minimumReleaseAge: 1440

# @napi-rs/wasm-runtime asks for a wasm-util release that is less than a day
# old. It is only used by the WebAssembly fallback of the bundler, so the
# previous release is pinned until the new one has aged. Safe to remove later.
overrides:
  '@tybys/wasm-util': 0.10.4
